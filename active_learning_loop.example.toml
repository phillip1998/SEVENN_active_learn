# Active-learning loop configuration generated by scripts/gui_active_learning_loop.py.

work_dir = "active_learning_loop_run"
poll_seconds = 3600
max_iterations = 20
convergence_patience = 4
execute_md = false
execute_finetune = false

[dft]
base_url = "http://localhost:8000"
nodes = ["node01", "node02"]
job_name = "Gau_AL"
gaussian_job_prefix = "active_learning"
route = "#p wb97xd/def2svp nosymm force scf=tight"
charge = 0
multiplicity = 1
mem = "16GB"
nprocshared = 16
submit = true

[sampling]
initial_total = 24
min_total = 4
max_total = 96
target_loop_hours = 12.0
cluster_sizes = [2, 3, 4]
initial_weights = { "2" = 0.85, "3" = 0.15, "4" = 0.0 }
mature_weights = { "2" = 0.25, "3" = 0.45, "4" = 0.3 }
weight_ramp_steps = 6
frame_stride = 1
max_frames = 100
random_frame_samples = 8
candidate_seeds_per_frame = 40
neighbor_pool = 8
contact_cutoff_angstrom = 5.0
close_contact_alert_angstrom = 1.2
hard_reject_distance_angstrom = 0.55
random_seed = 17

[md]
gro_path = "YCOL160.gro"
xtc_path = "YCOL160.xtc"
model_path = "7net-omni"
modal = "omol25_low"
pair_style = "e3gnn/parallel"
parallel_model_count = 4
enable_flash = true
temperature_k = 300.0
timestep_ps = 0.001
run_steps = 1000
thermo_interval = 100
dump_interval = 100
ensemble = "nvt"
seed = 12345
d3 = false
run_command = '''mpirun --allow-run-as-root -np 3 bash -c '
  ulimit -s unlimited
  export PYTORCH_NO_CUDA_MEMORY_CACHING=1
  export CUDA_VISIBLE_DEVICES=$OMPI_COMM_WORLD_LOCAL_RANK
  lmp -in in.sevennet.lmp
''''
expected_dump = "dump.sevennet.lammpstrj"

[finetune]
pretrained = "7net-omni"
modal = "omol25_low"
external_log_dirs = []
epoch = 20
batch_size = 1
learning_rate = 1e-05
force_loss_weight = 10.0
data_divide_ratio = 0.2
best_metric = "Force_RMSE"
huber_delta = 0.1
train_shift_scale = true
train_denominator = false
require_normal_termination = false
run_command = "bash run_finetune.sh"
